# Local-development-only overlay.
#
# `docker compose` auto-merges this file on top of docker-compose.yml for
# any plain `docker compose ...` invocation run from this directory (see
# https://docs.docker.com/compose/multiple-compose-files/merge/). It exists
# solely to let host-side tooling (scripts/smoke-rag.mjs, `npm run
# ingest:pdf`, manual curl/Qdrant dashboard use) reach Qdrant at
# localhost:6333, which docker-compose.yml intentionally does not publish.
#
# Production and CI deployments MUST exclude this file so Qdrant is never
# exposed on the host: run
#   docker compose -f docker-compose.yml up -d
# (or set COMPOSE_FILE=docker-compose.yml) instead of a bare
# `docker compose up -d`.
services:
  qdrant:
    ports:
      # Loopback-only: never 0.0.0.0:6333, even for local dev.
      - "127.0.0.1:6333:6333"
