services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: brevet-master-qdrant
    restart: unless-stopped
    # No published ports: Qdrant is reachable only from the "app" service
    # over the private brevet-internal network (http://qdrant:6333).
    # Do not add a "ports:" mapping here without a documented operational need.
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - brevet-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # The official qdrant/qdrant image has neither curl nor wget, so the
      # healthcheck opens a raw TCP connection to the REST port via bash's
      # /dev/tcp instead of doing an HTTP request.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brevet-master-app
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/brevet.sqlite
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - brevet_data:/app/data
    networks:
      - brevet-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  brevet_data:
  qdrant_storage:

networks:
  brevet-internal:
    driver: bridge
